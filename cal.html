
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Neon Calculator</title>

    <style>
        /* ===== GLOBAL STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            background:
                radial-gradient(circle at top, #14251b, transparent 45%),
                #050505;
        }

        /* ===== MAIN CALCULATOR ===== */
        .calculator {
            width: 370px;
            max-width: 100%;
            padding: 25px;
            background: linear-gradient(145deg, #151515, #090909);
            border: 1px solid #303030;
            border-radius: 25px;
            box-shadow:
                0 0 15px rgba(163, 230, 53, 0.12),
                0 0 45px rgba(163, 230, 53, 0.06),
                0 25px 60px rgba(0, 0, 0, 0.8);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #101a0b;
            border: 1px solid #a3e635;
            border-radius: 18px;
            color: #a3e635;
            font-size: 30px;
            box-shadow: 0 0 20px rgba(163, 230, 53, 0.2);
        }

        .header h1 {
            color: #a3e635;
            font-size: 24px;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(163, 230, 53, 0.35);
        }

        .header p {
            color: #888;
            font-size: 12px;
            margin-top: 7px;
        }

        /* ===== DISPLAY ===== */
        .display-box {
            padding: 18px;
            margin-bottom: 20px;
            background: #080808;
            border: 1px solid #343434;
            border-radius: 15px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.7);
        }

        .display-label {
            color: #777;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        #display {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #a3e635;
            font-size: 34px;
            font-weight: 600;
            text-align: right;
            caret-color: transparent;
        }

        #display::placeholder {
            color: #454545;
        }

        /* ===== BUTTON GRID ===== */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        button {
            min-width: 0;
            height: 56px;
            background: #1b1b1b;
            border: 1px solid #303030;
            border-radius: 13px;
            color: #f5f5f5;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            border-color: #a3e635;
            color: #a3e635;
            background: #22291a;
            box-shadow: 0 0 12px rgba(163, 230, 53, 0.12);
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background: #171f12;
            border-color: #526d2a;
            color: #bef264;
        }

        .clear {
            background: #291010;
            border-color: #7f1d1d;
            color: #fb7185;
        }

        .clear:hover {
            background: #401313;
            border-color: #fb7185;
            color: #fecdd3;
            box-shadow: 0 0 12px rgba(251, 113, 133, 0.18);
        }

        .delete {
            font-size: 14px;
        }

        .equal {
            background: #a3e635;
            border-color: #a3e635;
            color: #101010;
            font-size: 25px;
            box-shadow: 0 0 15px rgba(163, 230, 53, 0.15);
        }

        .equal:hover {
            background: #bef264;
            color: #000;
            box-shadow: 0 0 22px rgba(163, 230, 53, 0.3);
        }

        .zero {
            grid-column: span 2;
        }

        /* ===== HISTORY PANEL ===== */
        .history-section {
            margin-top: 24px;
            padding: 16px;
            background: linear-gradient(145deg, #111, #090909);
            border: 1px solid #303030;
            border-radius: 17px;
        }

        .history-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .history-heading h2 {
            color: #d9f99d;
            font-size: 15px;
        }

        .storage-status {
            color: #a3e635;
            font-size: 10px;
            white-space: nowrap;
        }

        #historyList {
            list-style: none;
            max-height: 170px;
            overflow-y: auto;
        }

        #historyList li {
            padding: 11px;
            margin-bottom: 8px;
            background: #151515;
            border: 1px solid #292929;
            border-left: 3px solid #a3e635;
            border-radius: 8px;
            color: #d4d4d4;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #historyList li.empty-history {
            color: #777;
            text-align: center;
            border-left: none;
        }

        .clear-history {
            width: 100%;
            height: 38px;
            margin-top: 8px;
            background: #211010;
            border-color: #4a2222;
            color: #fb7185;
            font-size: 12px;
        }

        .clear-history:hover {
            background: #351313;
            border-color: #fb7185;
            color: #fecdd3;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 18px;
            color: #777;
            text-align: center;
            font-size: 11px;
            line-height: 1.8;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 400px) {
            .calculator {
                padding: 17px;
            }

            button {
                height: 50px;
                font-size: 18px;
            }

            #display {
                font-size: 29px;
            }

            .header h1 {
                font-size: 21px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="calculator">

        <header class="header">
            <div class="logo">🧮</div>
            <h1>BLACK NEON</h1>
            <p>SMART CALCULATOR SYSTEM</p>
        </header>

        <!-- Display -->
        <section class="display-box">
            <div class="display-label">CALCULATION DISPLAY</div>

            <input
                type="text"
                id="display"
                placeholder="0"
                aria-label="Calculator display"
                readonly
            >
        </section>

        <!-- Calculator Buttons -->
        <section class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>
            <button class="delete" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="appendOperator('%')">%</button>
            <button class="operator" onclick="appendOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="appendOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </section>

        <!-- Storage Mode / History -->
        <section class="history-section">

            <div class="history-heading">
                <h2>▣ CALCULATION HISTORY</h2>
                <span class="storage-status">● LOCAL STORAGE</span>
            </div>

            <ul id="historyList"></ul>

            <button
                class="clear-history"
                onclick="clearHistory()"
            >
                CLEAR HISTORY
            </button>

        </section>

        <footer class="footer">
            KEYBOARD ENABLED · AUTO-SAVED HISTORY<br>
            POWERED BY HTML, CSS & JAVASCRIPT
        </footer>

    </main>

    <script>
        const display = document.getElementById("display");
        const historyList = document.getElementById("historyList");

        const STORAGE_KEY = "blackNeonCalculatorHistory";

        // Load saved history safely
        function loadHistory() {
            try {
                const saved = JSON.parse(
                    localStorage.getItem(STORAGE_KEY) || "[]"
                );

                if (!Array.isArray(saved)) {
                    return [];
                }

                return saved
                    .filter(item => typeof item === "string")
                    .slice(0, 20);
            } catch {
                return [];
            }
        }

        let calculationHistory = loadHistory();

        // Add a number or decimal point
        function appendNumber(number) {
            if (display.value === "Error") {
                display.value = "";
            }

            const currentNumber =
                display.value.split(/[+\-*/%]/).pop();

            if (number === ".") {
                if (currentNumber.includes(".")) {
                    return;
                }

                if (currentNumber === "") {
                    display.value += "0";
                }
            }

            display.value += number;
        }

        // Add an arithmetic operator
        function appendOperator(operator) {
            if (display.value === "Error") {
                return;
            }

            if (display.value === "" && operator !== "-") {
                return;
            }

            const lastChar = display.value.slice(-1);

            if ("+-*/%".includes(lastChar)) {
                // Allow negative values such as 5 * -2
                if (
                    operator === "-" &&
                    ["*", "/", "%"].includes(lastChar)
                ) {
                    display.value += operator;
                    return;
                }

                // Do not replace a standalone minus sign
                if (display.value === "-") {
                    return;
                }

                display.value = display.value.slice(0, -1);
            }

            display.value += operator;
        }

        // Clear the current calculation
        function clearDisplay() {
            display.value = "";
        }

        // Delete the last character
        function deleteLast() {
            if (display.value === "Error") {
                display.value = "";
                return;
            }

            display.value = display.value.slice(0, -1);
        }

        // Evaluate a mathematical expression
        function calculate() {
            const expression = display.value.trim();

            if (!expression || expression === "Error") {
                return;
            }

            // Allow only calculator characters
            if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {
                display.value = "Error";
                return;
            }

            // Reject incomplete expressions
            if (/[+\-*/%.]$/.test(expression)) {
                display.value = "Error";
                return;
            }

            try {
                const result = Function(
                    '"use strict"; return (' + expression + ')'
                )();

                if (
                    typeof result !== "number" ||
                    !Number.isFinite(result)
                ) {
                    display.value = "Error";
                    return;
                }

                const formattedResult = String(
                    Number(result.toPrecision(12))
                );

                // Store the calculation
                calculationHistory.unshift(
                    expression + " = " + formattedResult
                );

                // Keep only the latest 20 calculations
                calculationHistory =
                    calculationHistory.slice(0, 20);

                saveHistory();

                // Show the answer
                display.value = formattedResult;

            } catch {
                display.value = "Error";
            }
        }

        // Save history to localStorage
        function saveHistory() {
            try {
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(calculationHistory)
                );
            } catch {
                // Calculation still works if storage is unavailable
            }

            showHistory();
        }

        // Render saved calculations safely
        function showHistory() {
            historyList.replaceChildren();

            if (calculationHistory.length === 0) {
                const item = document.createElement("li");

                item.textContent = "No calculations saved yet.";
                item.className = "empty-history";

                historyList.appendChild(item);
                return;
            }

            calculationHistory.forEach(function(calculation) {
                const item = document.createElement("li");

                item.textContent = calculation;
                historyList.appendChild(item);
            });
        }

        // Clear all stored calculations
        function clearHistory() {
            calculationHistory = [];

            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch {
                // Also clear the visible list
            }

            showHistory();
        }

        // Keyboard support
        document.addEventListener("keydown", function(event) {
            const key = event.key;

            if (/^[0-9.]$/.test(key)) {
                appendNumber(key);
            } else if (
                ["+", "-", "*", "/", "%"].includes(key)
            ) {
                appendOperator(key);
            } else if (key === "Enter" || key === "=") {
                event.preventDefault();
                calculate();
            } else if (key === "Backspace") {
                deleteLast();
            } else if (key === "Escape" || key === "Delete") {
                clearDisplay();
            }
        });

        // Show saved history when the page loads
        showHistory();
    </script>

</body>
</html>
